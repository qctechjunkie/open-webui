services:
  # ==============================================================
  # Open WebUI — AI Chat Interface
  # Web UI: http://<host>:${WEBUI_PORT}
  # ==============================================================
  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:${WEBUI_VERSION:-main}
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    volumes:
      - ${DOCKER_DATA_PATH}/app/backend/data:/app/backend/data
      - ${DOCKER_DATA_PATH}/app/backend/workspace:/app/backend/workspace
      - ${DOCKER_DATA_PATH}/tmp:/tmp
    environment:
      # Core Configuration
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY must be set}
      WEBUI_URL: ${WEBUI_URL:?WEBUI_URL must be set}
      DATA_DIR: ${DATA_DIR:-/app/backend/data}
      # Database — Global Shared PostgreSQL
      DATABASE_URL: postgresql://${OPENWEBUI_DB_USER:?OPENWEBUI_DB_USER must be set}:${OPENWEBUI_DB_PASSWORD:?OPENWEBUI_DB_PASSWORD must be set}@${POSTGRES_HOST:-global-postgres}:5432/${OPENWEBUI_DB:?OPENWEBUI_DB must be set}
      # Model Integration
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Authentication
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-false}
      DEFAULT_USER_ROLE: ${DEFAULT_USER_ROLE:-pending}
      # OAuth/SSO
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-}
      OAUTH_PROVIDER_NAME: ${OAUTH_PROVIDER_NAME:-authentik}
      OPENID_PROVIDER_URL: ${OPENID_PROVIDER_URL:-}
      OPENID_REDIRECT_URI: ${OPENID_REDIRECT_URI:-}
      ENABLE_OAUTH_SIGNUP: ${ENABLE_OAUTH_SIGNUP:-false}
      ENABLE_LOGIN_FORM: ${ENABLE_LOGIN_FORM:-true}
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: ${OAUTH_MERGE_ACCOUNTS_BY_EMAIL:-true}
      # Security
      WEBUI_SESSION_COOKIE_SECURE: ${WEBUI_SESSION_COOKIE_SECURE:-true}
      # Code Interpreter
      ENABLE_CODE_INTERPRETER: ${ENABLE_CODE_INTERPRETER:-true}
      # RAG
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-nomic-embed-text}
      RAG_FILE_MAX_SIZE: ${RAG_FILE_MAX_SIZE:-10}
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - openwebui-internal
      - postgres-network

networks:
  openwebui-internal:
    driver: bridge
  postgres-network:
    external: true
    name: ${POSTGRES_NETWORK_NAME:?POSTGRES_NETWORK_NAME must be set}
