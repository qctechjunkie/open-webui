services:
  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:${WEBUI_VERSION:-main}
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    volumes:
      - ${DATA_VOLUME_PATH:-open-webui-data}:/app/backend/data
      - ${WORKSPACE_VOLUME_PATH:-open-webui-workspace}:/app/backend/workspace
      - ${TEMPORARY_VOLUME_PATH:-/tmp}:/tmp
    environment:
      # Core Configuration
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - WEBUI_URL=${WEBUI_URL}
      - DATA_DIR=${DATA_DIR:-/app/backend/data}

      # Model Integration
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

      # Authentication
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-false}
      - DEFAULT_USER_ROLE=${DEFAULT_USER_ROLE:-pending}

      # OAuth/SSO Configuration
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - OAUTH_PROVIDER_NAME=${OAUTH_PROVIDER_NAME:-authentik}
      - OPENID_PROVIDER_URL=${OPENID_PROVIDER_URL}
      - OPENID_REDIRECT_URI=${OPENID_REDIRECT_URI}

      # Security
      - WEBUI_SESSION_COOKIE_SECURE=${WEBUI_SESSION_COOKIE_SECURE:-true}

      # Code Interpreter
      - ENABLE_CODE_INTERPRETER=${ENABLE_CODE_INTERPRETER:-true}

      # RAG Configuration (if needed)
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-nomic-embed-text}
      - RAG_FILE_MAX_SIZE=${RAG_FILE_MAX_SIZE:-10}
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  open-webui-data:
  open-webui-workspace:

networks:
  default:
    name: ${NETWORK_NAME:-ollama-network}
